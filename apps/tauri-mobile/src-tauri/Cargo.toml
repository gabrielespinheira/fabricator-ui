[package]
name = "fabricator-ui-mobile"
version = "0.8.0"
description = "The offline Tauri mobile host for the Fabricator UI component explorer"
edition = "2021"
publish = false

[lib]
name = "fabricator_ui_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
