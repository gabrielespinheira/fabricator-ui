name: FabricatorSwiftUI
options:
  bundleIdPrefix: app.fabricator-ui
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  FabricatorUI:
    path: ../web/registry/swiftui
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FabricatorSwiftUI-iOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: .build/document-examples.json
        buildPhase: resources
      - path: .build/data-table-examples.json
        buildPhase: resources
    dependencies:
      - package: FabricatorUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fabricator-ui.swiftui
        PRODUCT_NAME: FabricatorSwiftUI
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Fabricator UI
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  FabricatorSwiftUI-macOS:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: .build/document-examples.json
        buildPhase: resources
      - path: .build/data-table-examples.json
        buildPhase: resources
    dependencies:
      - package: FabricatorUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fabricator-ui.swiftui.macos
        PRODUCT_NAME: FabricatorSwiftUI
        INFOPLIST_KEY_CFBundleDisplayName: Fabricator UI
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
  FabricatorSwiftUI-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      - path: ../web/generated/platforms/contract.json
        buildPhase: resources
      - path: .build/document-examples.json
        buildPhase: resources
    dependencies:
      - target: FabricatorSwiftUI-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fabricator-ui.swiftui.uitests
        TEST_TARGET_NAME: FabricatorSwiftUI-iOS
  FabricatorSwiftUI-UnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../web/registry/swiftui/tests/editor-rendering-tests.swift
    dependencies:
      - target: FabricatorSwiftUI-iOS
      - package: FabricatorUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fabricator-ui.swiftui.unittests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FabricatorSwiftUI.app/FabricatorSwiftUI
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  FabricatorSwiftUI-iOS:
    build:
      targets:
        FabricatorSwiftUI-iOS: all
    test:
      targets: [FabricatorSwiftUI-UnitTests, FabricatorSwiftUI-UITests]
  FabricatorSwiftUI-macOS:
    build:
      targets:
        FabricatorSwiftUI-macOS: all
