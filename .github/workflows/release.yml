name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version packages
    # Opens the "version packages" pull request from pending changesets.
    # Publishing is local: `bun run deploy` releases the CLI after the site
    # ships (scripts/publish.sh). Needs the repository variable
    # RELEASE_ENABLED=true and "Allow GitHub Actions to create and approve pull
    # requests" (Settings → Actions → General).
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Create the version pull request
        uses: changesets/action@v1
        with:
          version: bun run release
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
