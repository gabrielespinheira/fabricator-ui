name: Native platform builds

on:
  pull_request:
    paths:
      - apps/swiftui/**
      - apps/kotlin/**
      - apps/tauri-mobile/**
      - apps/web/registry/**
      - apps/web/scripts/build-*platform*.mts
      - apps/web/scripts/native-platforms*
      - packages/icons-core/**
      - package.json
      - bun.lock
      - packages/cli/src/**
      - scripts/check-native-consumers.ts
      - scripts/tsconfig.native.json
      - .github/workflows/native-platforms.yml
  push:
    branches: [main]

concurrency:
  group: native-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri:
    name: Tauri bundled frontend and macOS host
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/web icons:packages
      - run: bun run registry:build
      - run: bun run --cwd apps/tauri-mobile typecheck
      - run: bun run --cwd apps/tauri-mobile test
      - run: bun run --cwd apps/tauri-mobile build
      - run: bun run --cwd apps/tauri-mobile check:assets
      - run: cargo test --locked --manifest-path apps/tauri-mobile/src-tauri/Cargo.toml

  swiftui:
    name: SwiftUI apps and standalone consumers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install the Xcode project generator
        run: brew install xcodegen
      - run: bun run platforms:build
      - run: bun run example:mobile-swiftui:check
      - run: bun run example:desktop-swiftui:check
      - name: Compile every distinct consumer source closure
        run: bun scripts/check-native-consumers.ts --renderer swiftui --build

  compose:
    name: Compose Android and desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.5.0
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: bun install --frozen-lockfile
      - run: bun run platforms:build
      - run: bun run --cwd apps/kotlin check:source
      - run: xvfb-run bun run example:desktop-kotlin:check
      - run: bun run example:mobile-kotlin:build
      - name: Compile every distinct consumer source closure
        run: bun scripts/check-native-consumers.ts --renderer compose --build
