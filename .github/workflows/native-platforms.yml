name: Native libraries

# The demos never run in CI: this checks the SwiftUI and Compose sources the
# registry publishes, as a project that installs them would compile them.
on:
  pull_request:
    paths:
      - apps/web/registry/**
      - apps/web/scripts/build-*platform*.mts
      - apps/web/scripts/native-platforms*
      - apps/web/scripts/swiftui/**
      - apps/web/scripts/compose/**
      - packages/editor-native/**
      - packages/icons-core/**
      - package.json
      - bun.lock
      - packages/cli/src/**
      - scripts/check-native-consumers.ts
      - scripts/tsconfig.native.json
      - .github/workflows/native-platforms.yml
  push:
    branches: [main]

concurrency:
  group: native-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftui:
    name: SwiftUI library
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run platforms:build
      - name: Library tests
        run: swift test --package-path apps/web/registry/swiftui
      - name: Compile for iOS
        working-directory: apps/web/registry/swiftui
        run: xcodebuild -quiet -scheme FabricatorUI -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/swiftui" ONLY_ACTIVE_ARCH=YES ARCHS=arm64 build
      - name: Compile every distinct consumer source closure
        run: bun scripts/check-native-consumers.ts --renderer swiftui --build

  compose:
    name: Compose library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.5.0
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: bun install --frozen-lockfile
      - run: bun run platforms:build
      - name: Source inventory
        run: bun run --cwd apps/web compose:check
      - name: Library tests, and every distinct consumer source closure
        run: xvfb-run bun scripts/check-native-consumers.ts --renderer compose --build --tests
