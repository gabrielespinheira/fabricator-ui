name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_APP_URL: http://localhost:4000

jobs:
  check:
    name: Check, test and parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Demo content is rebranded
        run: bun run rebrand --check
      - name: Build registry
        run: bun run registry:build
      - name: Lint, typecheck, format
        run: bun run check
      - name: Unit tests
        run: bun run test
      - name: Upstream parity (ui.shadcn.com)
        run: bun run test:parity --styles all

  e2e:
    name: CLI end-to-end
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Build website and registry
        run: bun run build
      - name: Build CLI
        run: bun run cli:build
      - name: Start website
        working-directory: apps/web
        run: |
          bunx next start --port 4000 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/r/fabricator/base-nova/registry.json > /dev/null && exit 0
            sleep 2
          done
          echo "website did not start" && exit 1
      - name: End-to-end install tests
        run: bun run test:e2e
